<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>BibTeX Citation Maker</h1>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tab-btn-clean" class="tab active" role="tab" aria-controls="panel-clean" aria-selected="true">1 · Rút gọn BibTeX</button>
    <button id="tab-btn-url" class="tab" role="tab" aria-controls="panel-url" aria-selected="false">2 · Từ URL</button>
  </nav>

  <!-- ------------------------------------------------ TAB 1 -->
  <section id="panel-clean" class="panel" role="tabpanel">
    <label class="lbl" for="in-bib">Dán BibTeX đầy đủ (nhiều entry cũng được)</label>
    <textarea id="in-bib" rows="8" spellcheck="false"
      placeholder="@inproceedings{Starling2020,&#10;  title = {...},&#10;  abstract = {...},&#10;  ...&#10;}"></textarea>

    <div class="opts">
      <label><input type="checkbox" id="opt-doi" /> giữ <code>doi</code></label>
      <label><input type="checkbox" id="opt-url" /> giữ <code>url</code></label>
      <label><input type="checkbox" id="opt-date" checked /> <code>year+month</code> → <code>date</code></label>
      <label><input type="checkbox" id="opt-align" /> căn thẳng dấu <code>=</code></label>
    </div>

    <div class="row">
      <button id="btn-clean" class="primary">Rút gọn &amp; kiểm tra</button>
      <button id="btn-paste">Dán từ clipboard</button>
      <button id="btn-clear1" class="ghost">Xoá</button>
    </div>

    <div id="report1" class="report" hidden></div>

    <label class="lbl" for="out-bib">Kết quả</label>
    <textarea id="out-bib" rows="10" spellcheck="false" placeholder="Kết quả rút gọn sẽ hiện ở đây…"></textarea>
    <div class="row">
      <button id="btn-copy1" class="primary">Sao chép</button>
      <button id="btn-copytext" title="Chép trích dẫn dạng văn bản (giữ in nghiêng) để dán vào PowerPoint/Word">Chép dạng text (PPTX)</button>
      <select id="opt-style" title="Kiểu trích dẫn">
        <option value="ieee">IEEE</option>
        <option value="apa">APA</option>
      </select>
      <span id="status1" class="status" aria-live="polite"></span>
    </div>
  </section>

  <!-- ------------------------------------------------ TAB 2 -->
  <section id="panel-url" class="panel" role="tabpanel" hidden>
    <label class="lbl" for="in-url">URL trang web</label>
    <div class="row">
      <input id="in-url" type="url" placeholder="https://hadoop.apache.org/" spellcheck="false" />
      <button id="btn-tab" title="Lấy URL của tab đang mở">Tab hiện tại</button>
    </div>

    <div class="opts">
      <label><input type="checkbox" id="opt-strip" checked /> bỏ tham số theo dõi (<code>utm_*</code>…)</label>
      <label><input type="checkbox" id="opt-urldate" /> dùng <code>urldate</code> thay <code>note</code></label>
    </div>

    <div class="row">
      <button id="btn-fetch" class="primary">Tạo BibTeX</button>
      <button id="btn-clear2" class="ghost">Xoá</button>
      <span id="status2" class="status" aria-live="polite"></span>
    </div>

    <div id="report2" class="report" hidden></div>

    <fieldset id="meta" class="meta" hidden>
      <legend>Sửa nhanh trước khi chép</legend>
      <label class="f"><span>key</span><input id="f-key" spellcheck="false" /></label>
      <label class="f"><span>author</span><input id="f-author" spellcheck="false" /></label>
      <label class="f"><span>title</span><input id="f-title" spellcheck="false" /></label>
      <label class="f"><span>year</span><input id="f-year" spellcheck="false" /></label>
      <label class="f"><span>url</span><input id="f-url" spellcheck="false" /></label>
      <label class="f"><span>truy cập</span><input id="f-accessed" type="date" /></label>
    </fieldset>

    <label class="lbl" for="out-url">Kết quả</label>
    <textarea id="out-url" rows="8" spellcheck="false" placeholder="@online{…}"></textarea>
    <div class="row">
      <button id="btn-copy2" class="primary">Sao chép</button>
    </div>
  </section>

  <script src="bibtex.js"></script>
  <script src="popup.js"></script>
</body>
</html>
